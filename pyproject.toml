[project]
name = "albumentations-ci-foundation"
version = "0.1.0"
description = "Shared, security-hardened GitHub Actions for the Albumentations ecosystem"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Albumentations Team" }]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pyyaml>=6.0.2",
  "ruff>=0.12.0",
  "zizmor>=1.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
