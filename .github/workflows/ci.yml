name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate actions and helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup-python-uv
        with:
          python-version: "3.13"
          uv-version: "0.12.0"
          cache-dependency-glob: uv.lock
          cache-suffix: ci-foundation-dev

      - name: Install locked development tools
        run: uv sync --locked --group dev

      - name: Run unit tests
        run: uv run pytest

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

      - name: Run Zizmor
        run: uv run zizmor .github
