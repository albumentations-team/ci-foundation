name: Set up Python and uv without cache
description: Install caller-pinned Python and uv without restoring or saving a dependency cache.

inputs:
  python-version:
    description: Python version accepted by astral-sh/setup-uv.
    required: true
  uv-version:
    description: Exact uv version.
    required: true
  activate-environment:
    description: Whether setup-uv activates the selected Python environment.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv and Python ${{ inputs.python-version }} without a dependency cache
      uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
      with:
        activate-environment: ${{ inputs.activate-environment }}
        python-version: ${{ inputs.python-version }}
        version: ${{ inputs.uv-version }}
